.wc.on{background:var(--ac);border-color:var(--ac);color:#fff}
.wc.on .t{color:#ffe}
.wc.ok:after{content:"✓";position:absolute;top:2px;right:7px;font-size:.75rem;color:var(--ok)}
.wc.on.ok:after{color:#fff}
details{background:var(--bg);margin-bottom:10px}
summary{list-style:none;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:14px;font-weight:650;cursor:pointer;box-shadow:var(--sh);min-height:52px}

summary:after{content:"▾";margin-left:auto;color:var(--mut)}

.td summary{outline:2px solid var(--ac)}
.pill{font-size:.78rem;background:var(--bd);border-radius:99px;padding:2px 9px;font-weight:500}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}
